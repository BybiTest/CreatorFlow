name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: |
          npm install --no-audit

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Set up JDK 21 (Required for Capacitor 7)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Release Keystore
        run: |
          rm -f android/app/release.keystore
          keytool -genkeypair -v -keystore android/app/release.keystore -alias creatorflow -keyalg RSA -keysize 2048 -validity 10000 -storepass creatorflowpass -keypass creatorflowpass -dname "CN=CreatorFlow, OU=App, O=CreatorFlow, L=Tehran, S=Tehran, C=IR"

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Clean Gradle project
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CreatorFlow-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
